    <!-- ADMIN-7: se agregan los meta apple-mobile-web-app-* que faltaban —
         sin ellos, "Agregar a inicio" en iOS Safari abre el enlace dentro
         de Safari en vez de en modo standalone (sin barra de navegador).
         apple-mobile-web-app-title es el nombre que usa iOS (ignora
         manifest.name); se sobreescribe en runtime para /scan y la
         proyección — ver main.jsx. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
