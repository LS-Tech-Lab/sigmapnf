# Fix CI-6 (fase de optimización fina, 20 ago): npm audit en ci.yml
# (SEC-26/CI-3) detecta vulnerabilidades solo cuando alguien corre CI —
# nada avisaba de una CVE nueva en una dependencia ya instalada entre
# auditorías. Dependabot cierra ese hueco de forma proactiva, mismo
# criterio que ARCH-48 (health-check) ya aplicó a disponibilidad.
#
# xlsx NO se gestiona acá a propósito: viene de un tarball vendorizado
# (`file:./vendor/xlsx-0.20.3.tgz`, ver ARCH-13/SEC-14), no del registro
# de npm — Dependabot no puede rastrear su versión. Revisar manualmente
# contra cdn.sheetjs.com si se reporta una CVE nueva (mismo proceso ya
# documentado en el comentario de SEC-14/ci.yml).

version: 2
updates:
  # Dependencias de npm (dependencies + devDependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # LS trabaja solo, sin entorno local (sube archivos a mano vía
    # github.dev) — agrupar patch/minor en un solo PR semanal reduce el
    # ruido a revisar; los cambios major (con más chance de romper algo)
    # quedan fuera del grupo para que cada uno se revise por separado.
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # react/react-dom: subir de major a mano y coordinado, no vía PR
      # automático — cambios de comportamiento demasiado amplios para
      # revisar solo por el diff del PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Actions usadas en .github/workflows/*.yml (actions/checkout,
  # actions/setup-node, actions/upload-artifact, etc.) — mismo motivo:
  # una Action desactualizada puede traer su propia CVE (ej. tar-fs en
  # actions/checkout, feb 2025) sin que npm audit la vea nunca, porque
  # no es una dependencia de Node.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
